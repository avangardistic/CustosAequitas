name: MQL5 Compile & Test

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    name: Compile MQL5 Expert Advisors
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup MetaTrader
      uses: FX31337/MQL-Compile-Action@v1
      with:
        mt5-path: ${{ runner.tool_cache }}/metaeditor
        expert-folder: "CustosAequitas/Experts"
        include-folder: "CustosAequitas/Include"
        
    - name: Compile CustosAequitas EA
      uses: FX31337/MQL-Compile-Action@v1
      with:
        file: "CustosAequitas/Experts/CustosAequitas.mq5"
        includes: "CustosAequitas/Include"
        fail-on-error: true
        
    - name: Upload compiled EX5
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: compiled-experts
        path: |
          CustosAequitas/Experts/*.ex5
        retention-days: 7

  validate-python:
    name: Validate Python Tools
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
    - name: Generate synthetic datasets
      run: |
        mkdir -p Tests/Synthetic/datasets
        python Tools/PythonValidator/synthetic_generator.py --output Tests/Synthetic/datasets --seed 42 --samples 500
        
    - name: Verify dataset generation
      run: |
        ls -la Tests/Synthetic/datasets/
        cat Tests/Synthetic/datasets/ground_truth_summary.json
        
    - name: Upload generated datasets
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: synthetic-datasets
        path: Tests/Synthetic/datasets/
        retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [compile, validate-python]
    
    if: always()
    
    steps:
    - name: Check compilation status
      run: |
        echo "Compilation Status: ${{ needs.compile.result }}"
        if [ "${{ needs.compile.result }}" != "success" ]; then
          echo "❌ Compilation failed"
          exit 1
        fi
        echo "✅ Compilation successful"
        
    - name: Check Python validation status
      run: |
        echo "Python Validation Status: ${{ needs.validate-python.result }}"
        if [ "${{ needs.validate-python.result }}" != "success" ]; then
          echo "❌ Python validation failed"
          exit 1
        fi
        echo "✅ Python validation successful"
        
    - name: Summary
      run: |
        echo "## ✅ CI Pipeline Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| MQL5 Compilation | ${{ needs.compile.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Python Validation | ${{ needs.validate-python.result }} |" >> $GITHUB_STEP_SUMMARY
